name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/aura-ci@sha256:66392ce2a5f24668fb923d1c900c545435f6b453f3df585dc4668402c07042d5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Aura
        run: echo "$(bash scripts/install-aura.sh)" >> "$GITHUB_PATH"
      - name: Baseline pin
        run: python3 scripts/check-baseline.py --self
      - name: Test
        run: aura test
      - name: Playable headless demo
        run: aura run game/main.aura
      - name: Interactive smoke
        run: printf 'd\nf\nq\n' | aura run game/play.aura
      - name: Evolution demo
        run: aura run game/evolve-demo.aura
      - name: Bridge smoke
        run: |
          out=$(printf '{"cmd":"ping"}\n{"cmd":"wish-text","text":"海底的小鱼","seed":1}\n' | aura run game/server.aura)
          printf '%s' "$out" | grep -q '"pong"'
          printf '%s' "$out" | grep -q '"theme":"ocean"'
      - name: Bootstrap seed round
        run: aura run bootstrap/run.aura
